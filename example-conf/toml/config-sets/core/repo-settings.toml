[pull_requests]
allow_merge_commit = false
allow_squash_merge = true
allow_rebase_merge = false
allow_auto_merge = true
delete_branch_on_merge = true
# Matches GitHub UI option "Default message" for merge commits
merge_commit_message_option = "default_message"
# Matches GitHub UI option "Default message" for squash merges
squash_merge_option = "default_message"
